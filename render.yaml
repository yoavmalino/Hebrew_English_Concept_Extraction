# Optional. Render reads this file to deploy the demo API (demo/api) in one step; it is not
# needed to use the packages or the static demo page. In Render: New > Blueprint > this repo.
# Then put the service's URL in demo/web/config.js to turn on the upload form.
# The service is stateless: no database, no disk, no secrets, no request logs.
services:
  - type: web
    name: concept-extraction-demo
    runtime: python
    plan: free
    buildCommand: pip install ./extractor ./pipeline -r demo/api/requirements.txt
    # --no-access-log: the service logs nothing about requests or documents.
    startCommand: cd demo/api && uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      # Comma-separated origins allowed to call the API (the GitHub Pages site).
      - key: DEMO_ALLOWED_ORIGINS
        value: "https://yoavmalino.github.io"
