name: Demo site

# Publishes the static stage explorer (demo/web) to GitHub Pages. Enable Pages with
# "Source: GitHub Actions" in the repository settings first.
on:
  push:
    branches: [main]
    paths: ["demo/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demo/web
      - id: deployment
        uses: actions/deploy-pages@v5
