[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hebmath"
version = "1.1.0"
description = "Extract Hebrew-English text from PDF and DOCX in reading order, with math as LaTeX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["hebrew", "pdf", "docx", "latex", "bidi", "text-extraction"]
# The only third-party runtime dependency. Pinned exactly: output stability
# (byte-identical text for the same input) is part of the contract.
dependencies = [
    "pypdfium2==5.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hebmath = "hebmath.cli:main"

[project.urls]
Homepage = "https://github.com/yoavmalino/Hebrew_English_Concept_Extraction"
Demo = "https://yoavmalino.github.io/Hebrew_English_Concept_Extraction/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hebmath.data" = ["*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
