<h1>פרק 2: אינטגרלים</h1>
<p>תהי <math dir="ltr"><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mn>1</mn></math> פונקציה רציפה בקטע <math dir="ltr"><mo>[</mo><mn>0</mn><mo>,</mo><mn>1</mn><mo>]</mo></math>. אז מתקיים:</p>
<math dir="ltr" display="block"><msubsup><mo>∫</mo><mn>0</mn><mn>1</mn></msubsup><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mi>d</mi><mi>x</mi><mo>=</mo><mfrac><mn>4</mn><mn>3</mn></mfrac></math>
<p>נוסחת השורשים:</p>
<math dir="ltr" display="block"><msub><mi>x</mi><mrow><mn>1</mn><mo>,</mo><mn>2</mn></mrow></msub><mo>=</mo><mfrac><mrow><mo>−</mo><mi>b</mi><mo>±</mo><msqrt><msup><mi>b</mi><mn>2</mn></msup><mo>−</mo><mn>4</mn><mi>a</mi><mi>c</mi></msqrt></mrow><mrow><mn>2</mn><mi>a</mi></mrow></mfrac></math>
<p>לכל <math dir="ltr"><mi>ε</mi><mo>&gt;</mo><mn>0</mn></math> קיים <math dir="ltr"><mi>δ</mi><mo>&gt;</mo><mn>0</mn></math> כך ש-<math dir="ltr"><mo>|</mo><mi>x</mi><mo>−</mo><mi>a</mi><mo>|</mo><mo>&lt;</mo><mi>δ</mi></math> גורר את המסקנה. בשנת 2024 נבחנו 120 סטודנטים (כ-85% עברו).</p>
<math dir="ltr" display="block"><munderover><mo>∑</mo><mrow><mi>k</mi><mo>=</mo><mn>1</mn></mrow><mi>n</mi></munderover><mi>k</mi><mo>=</mo><mfrac><mrow><mi>n</mi><mo>(</mo><mi>n</mi><mo>+</mo><mn>1</mn><mo>)</mo></mrow><mn>2</mn></mfrac></math>
<p>טקסט ללא מתמטיקה, עם מילה באנגלית: Riemann sum, ומספר 3.14 בתוך משפט.</p>
